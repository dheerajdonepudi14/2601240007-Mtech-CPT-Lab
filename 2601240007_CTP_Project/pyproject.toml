[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "securecrypt"
version = "1.0.0"
description = "Authenticated file encryption utility with CLI and GUI"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["cryptography>=44", "rich>=13", "questionary>=2"]

[project.optional-dependencies]
dnd = ["tkinterdnd2>=0.4"]
test = ["pytest>=8", "hypothesis>=6"]

[project.scripts]
securecrypt = "securecrypt.cli:main"

[project.gui-scripts]
securecrypt-gui = "securecrypt.gui:main"

[tool.setuptools]
packages = ["securecrypt"]
